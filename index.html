<!-- Soru Sor & İletişim Masası (Otomatik E-Posta Gönderimli) -->
<section id="soru-sor" class="bg-slate-900/80 border border-amber-500/30 rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-800 pb-4">
    <div>
      <span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
        📬 Herkese Açık Danışma Masası
      </span>
      <h3 class="text-xl sm:text-2xl font-black text-white mt-2">
        Healthy Living AI Ekibine Soru Sor
      </h3>
      <p class="text-xs text-slate-400">Akıllı kolye donanımı veya kodlar hakkında merak ettiğin her şeyi sorabilirsin.</p>
    </div>
    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-right">
      <div class="text-[10px] text-slate-500">Resmi E-Posta:</div>
      <a href="mailto:healthylivingai@gmail.com" class="text-xs font-mono font-bold text-emerald-400 hover:underline">
        healthylivingai@gmail.com
      </a>
      <div class="text-[10px] text-slate-500 mt-0.5">Healthy Living AI</div>
    </div>
  </div>

  <!-- Doğrudan E-Posta Gönderen Form -->
  <form onsubmit="handleSendQuestion(event)" class="space-y-4 max-w-3xl">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Adınız:</label>
        <input type="text" id="q-name" required placeholder="Örn: Ahmet / Mühendis Arkadaş" class="w-full bg-slate-950 border border-slate-800 focus:border-amber-400 rounded-xl px-4 py-2.5 text-xs text-white outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Geri Dönüş E-Postanız: *</label>
        <input type="email" id="q-email" required placeholder="ornek@gmail.com" class="w-full bg-slate-950 border border-slate-800 focus:border-amber-400 rounded-xl px-4 py-2.5 text-xs text-white outline-none">
      </div>
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-300 mb-1">Sorunuz veya Mesajınız: *</label>
      <textarea id="q-msg" required rows="4" placeholder="Kolyenin sensörleri nasıl çalışıyor? Bataryası kaç saat dayanıyor?" class="w-full bg-slate-950 border border-slate-800 focus:border-amber-400 rounded-xl p-4 text-xs text-white outline-none"></textarea>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 pt-2">
      <!-- Buton 1: Arka Planda Otomatik Gönderim -->
      <button type="submit" id="submit-btn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black text-xs flex items-center justify-center gap-2 hover:opacity-90 shadow-lg shadow-amber-500/20">
        🚀 Otomatik E-Posta Gönder
      </button>

      <!-- Buton 2: Tarayıcıda Web Gmail Sekmesi Açma (Yedek Güvenli Yol) -->
      <button type="button" onclick="openWebGmail()" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 text-xs font-bold flex items-center justify-center gap-2">
        🌐 Web Gmail'de Aç & Gönder
      </button>
    </div>

    <!-- Bildirim Kutusu -->
    <div id="status-box" class="hidden p-4 rounded-xl text-xs font-bold"></div>
  </form>
</section>

<script>
  async function handleSendQuestion(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const box = document.getElementById('status-box');
    const name = document.getElementById('q-name').value;
    const email = document.getElementById('q-email').value;
    const msg = document.getElementById('q-msg').value;

    btn.disabled = true;
    btn.innerHTML = '⏳ Gönderiliyor...';

    try {
      const res = await fetch("https://formsubmit.co/ajax/healthylivingai@gmail.com", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          _subject: "Healthy Living AI - Yeni Ziyaretçi Sorusu (" + name + ")",
          _captcha: "false",
          isim: name,
          eposta: email,
          soru: msg,
          tarih: new Date().toLocaleString("tr-TR")
        })
      });

      if (res.ok) {
        box.className = "p-4 rounded-xl text-xs font-bold bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 block";
        box.innerHTML = "✅ Sorun <strong>healthylivingai@gmail.com</strong> adresine başarıyla iletildi! En kısa sürede yanıtlanacaktır.";
        document.getElementById('q-msg').value = '';
      } else {
        throw new Error('Gönderim başarısız');
      }
    } catch (err) {
      box.className = "p-4 rounded-xl text-xs font-bold bg-amber-950/80 border border-amber-500/50 text-amber-300 block";
      box.innerHTML = "⚠️ Otomatik gönderim engellendi. Lütfen yanındaki <strong>'Web Gmail'de Aç & Gönder'</strong> butonuna tıklayarak doğrudan gönderin.";
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🚀 Otomatik E-Posta Gönder';
    }
  }

  function openWebGmail() {
    const name = document.getElementById('q-name').value || 'Ziyaretçi';
    const email = document.getElementById('q-email').value || 'Belirtilmedi';
    const msg = document.getElementById('q-msg').value || '';
    const subject = encodeURIComponent("Healthy Living AI Sorusu (" + name + ")");
    const body = encodeURIComponent("İsim: " + name + "\nE-Posta: " + email + "\n\nSoru / Mesaj:\n" + msg);
    window.open("https://mail.google.com/mail/?view=cm&fs=1&to=healthylivingai@gmail.com&su=" + subject + "&body=" + body, "_blank");
  }
</script>
